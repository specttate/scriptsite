<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моё Чистое Приложение</title>
    <style>
        /* Убираем все отступы вокруг страницы */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Прячем прокрутку самого сайта */
            background-color: #ffffff;
        }
        /* Растягиваем фрейм со скриптом на весь экран */
        iframe {
            width: 100%;
            height: 100%;
            border: none; /* Убираем стандартную рамку вокруг фрейма */
            display: block;
        }
    </style>
</head>
<body>

    <!-- Вставьте вашу ссылку из Шага 1 в параметр src вместо текста ВАША_ССЫЛКА_ИЗ_GOOGLE -->
    <iframe src="https://script.google.com/macros/s/AKfycbwwwblZ_1uF8NlVB2f4iozkQkm632T8GGGSN2w__e9NUnVkQf68CkFzN834P4uyAp4w/exec"></iframe>
</body>
</html>
