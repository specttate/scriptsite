<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моё Приложение</title>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #fff; font-family: sans-serif; }
        #app-container { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <div id="app-container">Загрузка приложения...</div>

    <script>
        // ВСТАВЬТЕ СЮДА ВАШУ ССЫЛКУ ИЗ GOOGLE APPS SCRIPT (которая заканчивается на /exec)
        const webAppUrl = "https://script.google.com/macros/s/AKfycbwwwblZ_1uF8NlVB2f4iozkQkm632T8GGGSN2w__e9NUnVkQf68CkFzN834P4uyAp4w/exec";

        // Функция безопасного получения данных в обход блокировки фреймов
        fetch(webAppUrl)
            .then(response => response.text())
            .then(html => {
                // Очищаем контейнер и внедряем чистый HTML вашего скрипта без баннеров
                const container = document.getElementById('app-container');
                container.innerHTML = html;
                
                // Выполняем скрипты Google, если они есть внутри веб-приложения
                const scripts = container.querySelectorAll('script');
                scripts.forEach(oldScript => {
                    const newScript = document.createElement('script');
                    Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                    newScript.appendChild(document.createTextNode(oldScript.innerHTML));
                    oldScript.parentNode.replaceChild(newScript, oldScript);
                });
            })
            .catch(err => {
                document.getElementById('app-container').innerHTML = "Ошибка загрузки. Проверьте ссылку на веб-приложение.";
                console.error(err);
            });
    </script>
</body>
</html>
